name: Geocode missing shop coordinates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve missing coordinates
        run: python scripts/geocode.py
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Commit coordinates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/geocode-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified shop coordinates"
            git push
          else
            echo "No coordinate changes."
          fi
