<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>讃岐うどんマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#f7f7f5}
header{padding:15px 20px;background:white;border-bottom:1px solid #ddd}h1{margin:0 0 6px;font-size:1.35rem}.notice{font-size:.85rem;color:#555;line-height:1.5}
main{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 88px)}aside{padding:14px;background:#fff;border-right:1px solid #ddd;overflow:auto;max-height:calc(100vh - 88px)}
#map{min-height:620px}input,select{width:100%;padding:9px;margin:5px 0 12px;border:1px solid #bbb;border-radius:8px;background:#fff}.count{font-weight:700;margin:4px 0 12px}
.shop{padding:12px 0;border-top:1px solid #eee}.shop h3{font-size:1rem;margin:0 0 5px}.shop p{font-size:.88rem;margin:4px 0;line-height:1.45}.tag{display:inline-block;font-size:.75rem;background:#eee;padding:3px 7px;border-radius:999px;margin:2px 3px 2px 0}.small{color:#666;font-size:.8rem}
@media(max-width:760px){main{grid-template-columns:1fr}#map{min-height:48vh;grid-row:1}aside{max-height:none;border-right:0}}
</style></head><body>
<header><h1>讃岐うどんマップ</h1><div class="notice">掲載情報は参考情報です。営業状況・営業時間・定休日等は実際と異なる場合があります。来店前に店舗の公式情報をご確認ください。</div></header>
<main><aside>
<label for="search">店名・住所で検索</label><input id="search" type="search" placeholder="例：高松、店名">
<label for="area">エリア（住所に含まれる語句）</label><input id="area" type="text" placeholder="例：高松市、丸亀市">
<label for="firmness">麺のコシ</label><select id="firmness"><option value="">すべて</option><option>強め</option><option>普通</option><option>やわらかめ</option><option>未確認</option></select>
<label for="dashi">出汁</label><select id="dashi"><option value="">すべて</option><option>いりこ系</option><option>混合</option><option>未確認</option></select>
<div class="count" id="count">読み込み中…</div><div id="list"></div>
</aside><div id="map" aria-label="うどん店マップ"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([34.25,133.95],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let shops=[],markers=[];const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const q=$('search').value.trim().toLowerCase(),area=$('area').value.trim().toLowerCase(),firm=$('firmness').value,dashi=$('dashi').value;
 const filtered=shops.filter(s=>`${s.name||''} ${s.address||''}`.toLowerCase().includes(q)&&String(s.address||'').toLowerCase().includes(area)&&(!firm||(s.firmness||'未確認')===firm)&&(!dashi||(s.dashi_flavor||'未確認')===dashi)&&s.status!=='closed');
 markers.forEach(m=>map.removeLayer(m));markers=[];$('count').textContent=`${filtered.length} 店舗`;
 $('list').innerHTML=filtered.map(s=>`<article class="shop"><h3>${esc(s.name)}</h3><p>${esc(s.address||'住所未確認')}</p><p>${esc(s.business_hours||'営業時間未確認')} / ${esc(s.regular_holiday||'定休日未確認')}</p><div>${[s.service_type&&`形式：${s.service_type}`,s.noodle_thickness&&`太さ：${s.noodle_thickness}`,s.firmness&&`コシ：${s.firmness}`,s.dashi_flavor&&`出汁：${s.dashi_flavor}`].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="small">確認日：${esc(s.last_verified||'未確認')} ・ 状態：${esc(s.status||'unverified')}${Number.isFinite(s.lat)&&Number.isFinite(s.lng)?'':' ・ 座標未確認'}</p>${s.source_url?`<p><a href="${esc(s.source_url)}" target="_blank" rel="noopener noreferrer">出典を確認</a></p>`:''}</article>`).join('')||'<p>条件に合う店舗がありません。</p>';
 filtered.forEach(s=>{if(Number.isFinite(s.lat)&&Number.isFinite(s.lng)){let m=L.marker([s.lat,s.lng]).addTo(map).bindPopup(`<strong>${esc(s.name)}</strong><br>${esc(s.address)}`);markers.push(m)}});
}
fetch('./data/data.json').then(r=>{if(!r.ok)throw Error('data.jsonを読み込めません');return r.json()}).then(d=>{shops=Array.isArray(d)?d:(d.shops||[]);render()}).catch(e=>{$('count').textContent='データ読み込みエラー';$('list').textContent=e.message});
['search','area','firmness','dashi'].forEach(id=>$(id).addEventListener('input',render));
</script></body></html>
